[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tenant-service"
version = "1.0.0"
description = "Enterprise OS member directory and admin-portal back end (P2.2): tenants, members, roles, app access, agents, invites, kept in sync with Keycloak."
requires-python = ">=3.11"
dependencies = [
  "taraz-auth[fastapi]>=1.0,<2",   # libs/taraz-auth in this repo
  "fastapi>=0.110",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["tenant_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
