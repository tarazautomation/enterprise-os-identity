# LOCAL ONLY: route http://localhost:8080 (k3d load balancer -> Traefik) to Keycloak.
# On EKS this is the Istio gateway at https://auth.<domain> (Zinoor, P1.4).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: identity
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
