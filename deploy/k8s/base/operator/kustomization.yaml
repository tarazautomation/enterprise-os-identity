# Keycloak Operator 26.8.1 in namespace "identity".
# The *.yml files are unmodified copies of keycloak/keycloak-k8s-resources at tag 26.8.1 (kubernetes/).
# Apply with server-side apply: the CRDs are too large for client-side apply.
#   kubectl apply --server-side -k base/operator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: identity

resources:
  - namespace.yaml
  - keycloakoidcclients.k8s.keycloak.org-v1.yml
  - keycloakrealmimports.k8s.keycloak.org-v1.yml
  - keycloaks.k8s.keycloak.org-v1.yml
  - keycloaksamlclients.k8s.keycloak.org-v1.yml
  - kubernetes.yml

# Same as upstream: also point the role bindings' service-account subjects at our namespace
transformers:
  - |-
    apiVersion: builtin
    kind: NamespaceTransformer
    metadata:
      name: set-identity-namespace
      namespace: identity
    setRoleBindingSubjects: allServiceAccounts
    fieldSpecs:
    - path: metadata/namespace
      create: true
