# Publish taraz-auth: push a tag taraz-auth-v<version> (the version in libs/taraz-auth/pyproject.toml).
# The wheel and its SHA-256 go on a GitHub Release; services install it by URL with --hash (libs/taraz-auth/README.md).
name: release taraz-auth

on:
  push:
    tags: ["taraz-auth-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e "libs/taraz-auth[fastapi,test]"
          cd libs/taraz-auth && pytest
      - name: Build the wheel
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("libs/taraz-auth/pyproject.toml","rb"))["project"]["version"])')
          [ "$GITHUB_REF_NAME" = "taraz-auth-v$version" ] || { echo "tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
          pip install build
          python -m build --wheel --outdir dist libs/taraz-auth
          (cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Install with the wheel's URL and the --hash from SHA256SUMS (libs/taraz-auth/README.md)."
